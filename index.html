<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation 3D</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
camera.position.z = 30;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6bdf'];

// --- Main torus knot ---
const torusGeo = new THREE.TorusKnotGeometry(6, 2, 180, 24);
const torusMat = new THREE.MeshPhysicalMaterial({
  color: '#4d96ff',
  metalness: 0.3,
  roughness: 0.1,
  wireframe: false,
  emissive: '#1a3a7a',
  emissiveIntensity: 0.3,
  clearcoat: 0.5,
});
const torus = new THREE.Mesh(torusGeo, torusMat);
scene.add(torus);

// --- Wireframe overlay ---
const wireGeo = new THREE.TorusKnotGeometry(6.1, 2, 180, 24);
const wireMat = new THREE.MeshBasicMaterial({
  color: '#88ccff',
  wireframe: true,
  transparent: true,
  opacity: 0.15,
});
const wire = new THREE.Mesh(wireGeo, wireMat);
scene.add(wire);

// --- Orbiting rings ---
for (let i = 0; i < 3; i++) {
  const r = new THREE.Mesh(
    new THREE.TorusGeometry(9 + i * 1.5, 0.03, 16, 100),
    new THREE.MeshBasicMaterial({ color: colors[i], transparent: true, opacity: 0.3 })
  );
  r.rotation.x = Math.PI / 2 + (i * Math.PI / 6);
  r.rotation.y = i * Math.PI / 4;
  scene.add(r);
}

// --- Particles ---
const count = 2000;
const positions = new Float32Array(count * 3);
const particleColors = new Float32Array(count * 3);
for (let i = 0; i < count; i++) {
  const radius = 12 + Math.random() * 12;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  positions[i*3] = radius * Math.sin(phi) * Math.cos(theta);
  positions[i*3+1] = radius * Math.sin(phi) * Math.sin(theta);
  positions[i*3+2] = radius * Math.cos(phi);
  const c = new THREE.Color(colors[Math.floor(Math.random() * colors.length)]);
  particleColors[i*3] = c.r;
  particleColors[i*3+1] = c.g;
  particleColors[i*3+2] = c.b;
}
const particleGeo = new THREE.BufferGeometry();
particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));
const particleMat = new THREE.PointsMaterial({
  size: 0.15,
  vertexColors: true,
  transparent: true,
  opacity: 0.8,
  blending: THREE.AdditiveBlending,
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// --- Little floating dots inside ---
const innerCount = 800;
const innerPos = new Float32Array(innerCount * 3);
for (let i = 0; i < innerCount; i++) {
  const r = Math.random() * 5;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  innerPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
  innerPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  innerPos[i*3+2] = r * Math.cos(phi);
}
const innerGeo = new THREE.BufferGeometry();
innerGeo.setAttribute('position', new THREE.BufferAttribute(innerPos, 3));
const innerMat = new THREE.PointsMaterial({
  size: 0.08,
  color: '#88ccff',
  transparent: true,
  opacity: 0.4,
  blending: THREE.AdditiveBlending,
});
const innerParticles = new THREE.Points(innerGeo, innerMat);
scene.add(innerParticles);

// --- Resize ---
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// --- Mouse interaction ---
let mouseX = 0, mouseY = 0;
document.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / innerWidth - 0.5) * 2;
  mouseY = (e.clientY / innerHeight - 0.5) * 2;
});

// --- Animate ---
const clock = new THREE.Clock();
function animate() {
  const t = clock.getElapsedTime();

  torus.rotation.x = t * 0.2;
  torus.rotation.y = t * 0.3;
  wire.rotation.x = t * 0.2;
  wire.rotation.y = t * 0.3;

  particles.rotation.x = t * 0.015;
  particles.rotation.y = t * 0.02;
  innerParticles.rotation.x = t * 0.03;
  innerParticles.rotation.y = t * 0.04;

  torus.position.x = mouseX * 2;
  torus.position.y = -mouseY * 2;
  wire.position.x = mouseX * 2;
  wire.position.y = -mouseY * 2;

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
